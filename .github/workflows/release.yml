# Newt-SFU 发布：多平台二进制 → 本仓 Release + 同步到 NewtSpeak/NewtSpeak
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 0.1.3）"
        required: true
        type: string
      extra_notes:
        description: "附加到 Release 说明的额外备注（可选）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  RELEASE_HUB_REPO: NewtSpeak/NewtSpeak

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Compute version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "empty version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist
          OUT="dist/newt-sfu-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/newtspeak/newt-sfu/internal/buildinfo.Version=${VERSION}" \
            -o "${OUT}" ./cmd/newt-sfu
          sha256sum "${OUT}" | tee "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: newt-sfu-${{ needs.resolve-version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release + Hub sync
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: newt-sfu-*
          merge-multiple: true

      - name: Prepare checksums
        working-directory: release-assets
        run: |
          ls -lah
          {
            if ls *.sha256 >/dev/null 2>&1; then cat *.sha256
            else sha256sum newt-sfu-*
            fi
          } > "SHA256SUMS-newt-sfu-${{ needs.resolve-version.outputs.version }}.txt"
          cat "SHA256SUMS-newt-sfu-${{ needs.resolve-version.outputs.version }}.txt"

      - name: Write extra notes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_notes != '' }}
        run: |
          printf '%s\n' "${{ inputs.extra_notes }}" > EXTRA_NOTES.md

      - name: Generate release notes
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/ci/generate-release-notes.sh
          EXTRA=""
          if [ -f EXTRA_NOTES.md ]; then EXTRA=EXTRA_NOTES.md; fi
          scripts/ci/generate-release-notes.sh "Newt-SFU" "$EXTRA" | tee RELEASE_BODY.md

      - name: Create own-repo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Newt-SFU ${{ needs.resolve-version.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            release-assets/newt-sfu-*
            release-assets/SHA256SUMS-newt-sfu-*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to NewtSpeak/NewtSpeak hub
        env:
          RELEASE_HUB_TOKEN: ${{ secrets.RELEASE_HUB_TOKEN }}
          RELEASE_HUB_REPO: ${{ env.RELEASE_HUB_REPO }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          COMPONENT_KEY: Newt-SFU
          COMPONENT_TITLE: Newt-SFU（媒体面）
          RELEASE_BODY_PATH: RELEASE_BODY.md
          ASSET_GLOBS: "release-assets/newt-sfu-* release-assets/SHA256SUMS-newt-sfu-*"
        run: |
          chmod +x scripts/ci/sync-release-hub.sh
          scripts/ci/sync-release-hub.sh
