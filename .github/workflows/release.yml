# Owl-SFU 发布：多平台二进制 + SHA256 + GitHub Release
# 触发：推送 v* 标签，或手动 workflow_dispatch 指定版本号
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 0.1.3）"
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Compute version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "empty version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist
          # 与 Server 约定一致：owl-sfu-<version>-<goos>-<goarch>（无扩展名）
          OUT="dist/owl-sfu-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/owlspeak/owl-sfu/internal/buildinfo.Version=${VERSION}" \
            -o "${OUT}" ./cmd/owl-sfu
          sha256sum "${OUT}" | tee "${OUT}.sha256"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-sfu-${{ needs.resolve-version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: owl-sfu-*
          merge-multiple: true

      - name: Prepare checksums
        working-directory: release-assets
        run: |
          ls -lah
          # 汇总校验和（若分平台已有 .sha256 则合并）
          if ls *.sha256 >/dev/null 2>&1; then
            cat *.sha256 > SHA256SUMS
          else
            sha256sum owl-sfu-* > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Owl-SFU ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/owl-sfu-*
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
